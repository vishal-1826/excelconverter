<div class="drop-zone" (drop)="onFileDrop($event)" (dragover)="$event.preventDefault()">
  <p>Drag and drop Excel file here or</p>
  <input type="file" (change)="onFileSelect($event)" accept=".xlsx, .xls" />
</div>

<div *ngIf="tableHeaders.length">
  <input class="filter-box" type="text" placeholder="Search table..." [(ngModel)]="filterText" (input)="applyFilter()" />

  <div class="dropdown-container">
    <button class="red-btn dropdown-toggle">Download Table ▼</button>
    <div class="dropdown-menu">
      <div *ngIf="fileType !== 'excel'" (click)="downloadAs('xlsx')">Excel (.xlsx)</div>
      <div *ngIf="fileType !== 'csv'" (click)="downloadAs('csv')">CSV (.csv)</div>
      <div *ngIf="fileType !== 'html'" (click)="downloadAs('html')">HTML (.html)</div>
      <div *ngIf="fileType !== 'json'" (click)="downloadAs('json')">JSON (.json)</div>
      <div *ngIf="fileType !== 'pdf'" (click)="downloadAs('pdf')">PDF (.pdf)</div>
    </div>
  </div>
  <input class="filename-box" type="text" placeholder="Enter file name..." [(ngModel)]="fileName" />
  <!-- Google AdSense Placeholder -->
  <div style="width:100%;text-align:center;margin:20px 0;">
    <!-- Replace the data-ad-client and data-ad-slot with your own values -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
  <table>
    <thead>
      <tr>
        <th *ngFor="let header of tableHeaders; let i = index" (click)="sortBy(header, i)">
          {{ header }} ⬍
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of filteredData">
        <td *ngFor="let cell of row">{{ cell }}</td>
      </tr>
    </tbody>
  </table>
</div>
